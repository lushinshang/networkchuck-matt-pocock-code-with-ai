<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 840" width="480" height="840" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>你與 agent 之間的溝通落差</title>
<desc>上方左右兩個方塊人形：左邊是你，知道一部分想要什麼；右邊是 agent，沒有記憶，從空白開始；中間一條虛線標溝通落差（影片 17:09）。下方兩條路並排：左路直接下指令，agent 一路猜，說聽起來不錯，做出你希望的東西（17:24）；右路讓 agent 先追問，一題一題把想法問清楚，才有機會得到你要的（17:37）。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="480" height="840" fill="#fbfaf7"/>
<text x="240.0" y="30" font-size="13" fill="#555555" text-anchor="middle">17:09</text>
<circle cx="110" cy="66" r="15" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
<rect x="20.0" y="90" width="180" height="96" rx="14" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
<text x="110" y="130" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle">你</text>
<text x="110" y="158" font-size="14" fill="#555555" text-anchor="middle">知道一部分想要什麼</text>
<circle cx="370" cy="66" r="15" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<rect x="280.0" y="90" width="180" height="96" rx="14" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="370" y="130" font-size="22" fill="#222222" font-weight="bold" text-anchor="middle">agent</text>
<text x="370" y="158" font-size="14" fill="#555555" text-anchor="middle">沒有記憶，從空白開始</text>
<text x="240.0" y="120" font-size="14" fill="#d9822b" font-weight="bold" text-anchor="middle">溝通落差</text>
<path d="M206 140 L274 140" stroke="#c0392b" stroke-width="3" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)" marker-start="url(#ah)"/>
<path d="M20 258 L460 258" stroke="#c9c8c0" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
<rect x="20" y="282" width="440" height="60" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
<text x="240.0" y="302" font-size="12" fill="#555555" text-anchor="middle">17:24</text>
<text x="240.0" y="328" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">直接下指令</text>
<path d="M240.0 344 L240.0 366" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="368" width="440" height="60" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
<text x="240.0" y="403.95" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">agent 一路猜，說聽起來不錯</text>
<path d="M240.0 430 L240.0 452" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="454" width="440" height="60" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
<text x="240.0" y="489.95" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">做出你希望的東西</text>
<path d="M20 540 L460 540" stroke="#c9c8c0" stroke-width="2" fill="none" stroke-dasharray="6 4"/>
<rect x="20" y="564" width="440" height="60" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="240.0" y="584" font-size="12" fill="#555555" text-anchor="middle">17:37</text>
<text x="240.0" y="610" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">讓 agent 先追問</text>
<path d="M240.0 626 L240.0 648" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="650" width="440" height="60" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="240.0" y="685.95" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">一題一題把想法問清楚</text>
<path d="M240.0 712 L240.0 734" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="20" y="736" width="440" height="60" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="240.0" y="771.95" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">才有機會得到你要的</text>
</svg>
