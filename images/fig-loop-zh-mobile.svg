<text x="240.0" y="843" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">retro</text>
<text x="240.0" y="865" font-size="12" fill="#555555" text-anchor="middle">把檢討寫回 standards 與自動檢查</text>
<path d="M462 840 L473 840 L473 190 L383 190 L383 174" stroke="#666" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
</svg>
