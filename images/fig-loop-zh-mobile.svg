<text x="152.5" y="145" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">grill-with-docs</text>
<text x="152.5" y="167" font-size="12" fill="#555555" text-anchor="middle">先逐題追問；讀術語表與 ADR</text>
<rect x="300" y="112" width="165" height="60" rx="8" fill="#f4f3ee" stroke="#b5b4aa" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="382.5" y="147" font-size="12" fill="#222222" text-anchor="middle">術語表、ADR、standards</text>
<path d="M152 186 L152 205" stroke="#444" stroke-width="2" fill="none"/>
