<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 906" width="480" height="906" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>從想法到 merge 與 retro 的流程</title>
<desc>想法先進入 grill-with-docs，逐題追問並讀術語表與 ADR；之後分兩路：小功能直接 implement，大功能先寫成 spec、拆成 ticket，再用 implement-spec 以平行子 agent 各在 worktree 實作。兩路匯合到 code review（spec review、standards review），接著人工審查（看 merge danger）、merge、retro；retro 把檢討寫回 standards 與自動檢查，以虛線箭頭回到術語表、ADR、standards。各節點旁標有影片時間。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="480" height="906" fill="#fbfaf7"/>
<rect x="20" y="20" width="440" height="56" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="240.0" y="53.95" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">想法</text>
<path d="M240 78 L240 98" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
