<text x="100.0" y="272.9" font-size="14" fill="#222222" font-weight="bold" text-anchor="middle">小功能：implement</text>
<rect x="195" y="226" width="265" height="84" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="327.5" y="246" font-size="12" fill="#555555" text-anchor="middle">27:24</text>
<text x="327.5" y="272" font-size="14" fill="#222222" font-weight="bold" text-anchor="middle">大功能：寫成 spec，拆成 ticket</text>
<path d="M327 312 L327 338" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="195" y="340" width="265" height="84" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
