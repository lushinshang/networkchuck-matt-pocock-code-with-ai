<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>context 用量與兩種門檻說法</title>
<desc>一條水平長條代表 context 用量，由左到右漸層：左段是 smart zone，右段是 dumb zone；長條上方左端標 context 用量少，右端標 context 用量多。長條沒有刻度，兩個門檻也沒有畫在長條上。下方並排兩個說明方塊：Matt Pocock 說約 15 萬 token 就開始緊張（26:32）；Dex Horthy 說約四成處開始報酬遞減（演講 06:09）。一個用 token 數，一個用比例。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker><linearGradient id="zg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#cfe5d3"/><stop offset="1" stop-color="#f2c597"/></linearGradient></defs>
<rect width="1000" height="400" fill="#fbfaf7"/>
<text x="60" y="84" font-size="14" fill="#555555" text-anchor="start">context 用量少</text>
<text x="940" y="84" font-size="14" fill="#555555" text-anchor="end">context 用量多</text>
<rect x="60" y="100" width="880" height="60" rx="10" fill="url(#zg)" stroke="#c9c8c0" stroke-width="1.5"/>
<text x="84" y="138" font-size="20" fill="#2d5a38" font-weight="bold" text-anchor="start">smart zone</text>
<text x="916" y="138" font-size="20" fill="#8a4a0f" font-weight="bold" text-anchor="end">dumb zone</text>
<rect x="60" y="210" width="420" height="90" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="270.0" y="230" font-size="12" fill="#555555" text-anchor="middle">26:32</text>
<text x="270.0" y="256" font-size="16" fill="#222222" font-weight="bold" text-anchor="middle">Matt Pocock：約 15 萬 token 就開始緊張</text>
<rect x="520" y="210" width="420" height="90" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
<text x="730.0" y="230" font-size="12" fill="#555555" text-anchor="middle">演講 06:09</text>
<text x="730.0" y="256" font-size="16" fill="#222222" font-weight="bold" text-anchor="middle">Dex Horthy：約四成處開始報酬遞減</text>
<text x="500.0" y="346" font-size="15" fill="#555555" text-anchor="middle">一個用 token 數，一個用比例</text>
</svg>
