<text x="500.0" y="332" font-size="12" fill="#555555" text-anchor="middle">43:58</text>
<text x="500.0" y="358" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">merge</text>
<path d="M438 342 L402 342" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<rect x="170" y="300" width="230" height="84" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="285.0" y="320" font-size="12" fill="#555555" text-anchor="middle">42:34</text>
<text x="285.0" y="345" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle" font-family="Menlo, Consolas, monospace">retro</text>
<text x="285.0" y="367" font-size="12" fill="#555555" text-anchor="middle">把檢討寫回 standards 與自動檢查</text>
<path d="M285 298 L285 222" stroke="#666" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
</svg>
