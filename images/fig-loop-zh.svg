<text x="965.0" y="345" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">code review</text>
<text x="965.0" y="367" font-size="12" fill="#555555" text-anchor="middle">spec review、standards review</text>
<path d="M848 342 L812 342" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
