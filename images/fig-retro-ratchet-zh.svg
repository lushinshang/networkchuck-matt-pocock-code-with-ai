<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 400" width="1020" height="400" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>人工審查評論轉成自動檢查的循環</title>
<desc>環狀流程，順時針：人工審查留下評論（41:44），retro 回頭看 session 與 PR（42:34），試著改寫成自動檢查（型別、測試、linter；51:12），下次 agent 被擋下；再以虛線回到人工審查留下評論。環旁另有一個獨立方塊，檢查變慢，也請 agent 加速（51:44），以虛線連到試著改寫成自動檢查。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="1020" height="400" fill="#fbfaf7"/>
<rect x="50" y="60" width="290" height="84" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="195.0" y="80" font-size="12" fill="#555555" text-anchor="middle">41:44</text>
<text x="195.0" y="106" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">人工審查留下評論</text>
<rect x="400" y="60" width="290" height="84" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="545.0" y="80" font-size="12" fill="#555555" text-anchor="middle">42:34</text>
<text x="545.0" y="106" font-size="16" fill="#222222" font-weight="bold" text-anchor="middle">retro 回頭看 session 與 PR</text>
<rect x="400" y="250" width="290" height="84" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="2.5"/>
<text x="545.0" y="270" font-size="12" fill="#555555" text-anchor="middle">51:12</text>
<text x="545.0" y="295" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">試著改寫成自動檢查</text>
<text x="545.0" y="317" font-size="12" fill="#555555" text-anchor="middle">型別、測試、linter</text>
<rect x="50" y="250" width="290" height="84" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="195.0" y="297.95" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">下次 agent 被擋下</text>
<path d="M342 102 L398 102" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M545 146 L545 248" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M398 292 L342 292" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<path d="M195 248 L195 146" stroke="#666" stroke-width="2.5" fill="none" stroke-dasharray="6 4" marker-end="url(#ah)"/>
<rect x="750" y="250" width="250" height="84" rx="8" fill="#fff7ec" stroke="#d9822b" stroke-width="2.5" stroke-dasharray="7 5"/>
<text x="875.0" y="270" font-size="12" fill="#555555" text-anchor="middle">51:44</text>
<text x="875.0" y="305.0" font-size="15" fill="#222222" font-weight="bold" text-anchor="middle">檢查變慢，也請 agent 加速</text>
<path d="M748 292 L692 292" stroke="#666" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
</svg>
